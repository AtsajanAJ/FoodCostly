# DEFERRED: GitHub Actions auto-runs are paused because the GitHub
# account hit a billing lock ("job was not started because your account
# is locked due to a billing issue").
#
# Local verification completed (2026-11-19):
#   bun run lint
#   bun run typecheck
#   bun run test
#   bun run build
#
# Re-enable automatic CI after billing is resolved by restoring:
#   on:
#     push:
#       branches: [main, develop]
#     pull_request:
#       branches: [main, develop]
# and removing the workflow_dispatch-only trigger below.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder URLs so Prisma generate / Next build can resolve env validation
      # without connecting to a real database during CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/foodcostly?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/foodcostly?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
